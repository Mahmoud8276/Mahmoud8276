<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Mahmoud Nader - Software Engineer and .NET Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d26"/>
      <stop offset="1" stop-color="#241552"/>
    </linearGradient>
    <radialGradient id="blobA">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a78bfa" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="278" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* moving background */
      .dots  { animation: drift 6s linear infinite; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(22px,22px); } }

      .blobA { animation: moveA 14s ease-in-out infinite alternate; }
      .blobB { animation: moveB 17s ease-in-out infinite alternate; }
      .blobC { animation: moveC 20s ease-in-out infinite alternate; }
      @keyframes moveA { from { transform: translate(0,0); }       to { transform: translate(420px,60px); } }
      @keyframes moveB { from { transform: translate(0,0); }       to { transform: translate(-460px,-70px); } }
      @keyframes moveC { from { transform: translate(0,0); }       to { transform: translate(-300px,90px); } }

      .p { animation: rise linear infinite; opacity: 0; }
      @keyframes rise {
        0%   { transform: translateY(0);      opacity: 0; }
        15%  { opacity: 0.85; }
        85%  { opacity: 0.85; }
        100% { transform: translateY(-300px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .dots, .blobA, .blobB, .blobC, .p, .cursor { animation: none; }
      }
    </style>
  </defs>

  <!-- Base -->
  <rect x="1" y="1" width="998" height="278" rx="22" fill="url(#bg)"/>

  <!-- Moving background (clipped to the card) -->
  <g clip-path="url(#card)">
    <g class="dots"><rect x="-22" y="-22" width="1044" height="324" fill="url(#dots)"/></g>

    <circle class="blobA" cx="100"  cy="40"  r="260" fill="url(#blobA)"/>
    <circle class="blobB" cx="900"  cy="250" r="240" fill="url(#blobB)"/>
    <circle class="blobC" cx="700"  cy="60"  r="200" fill="url(#blobC)"/>

    <g fill="#c4b5fd">
      <circle class="p" cx="80"  cy="280" r="2.2" style="animation-duration:9s;  animation-delay:0s"/>
      <circle class="p" cx="170" cy="280" r="1.6" style="animation-duration:12s; animation-delay:2s"/>
      <circle class="p" cx="290" cy="280" r="2.6" style="animation-duration:10s; animation-delay:5s"/>
      <circle class="p" cx="410" cy="280" r="1.8" style="animation-duration:13s; animation-delay:1s"/>
      <circle class="p" cx="520" cy="280" r="2.4" style="animation-duration:11s; animation-delay:6s"/>
      <circle class="p" cx="640" cy="280" r="1.6" style="animation-duration:9s;  animation-delay:3s"/>
      <circle class="p" cx="760" cy="280" r="2.8" style="animation-duration:14s; animation-delay:4s"/>
      <circle class="p" cx="850" cy="280" r="1.8" style="animation-duration:10s; animation-delay:7s"/>
      <circle class="p" cx="940" cy="280" r="2.2" style="animation-duration:12s; animation-delay:8s"/>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="278" rx="22" fill="none" stroke="#4c3a8a" stroke-width="2"/>

  <!-- Vertical accent stripe -->
  <rect x="26" y="44" width="5" height="192" rx="2.5" fill="url(#stripe)"/>

  <!-- Role pill -->
  <rect x="52" y="42" width="452" height="30" rx="15" fill="#7c3aed" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <text x="70" y="62" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#c4b5fd">SOFTWARE ENGINEER  •  .NET BACKEND DEVELOPER</text>

  <!-- Name -->
  <text x="52" y="142" class="sans" font-size="58" font-weight="800" fill="url(#nameGrad)">Mahmoud Nader</text>

  <!-- Tagline -->
  <text x="52" y="180" class="sans" font-size="19" fill="#b4a9d6">Secure APIs. Clean architecture. Reliable systems.</text>

  <!-- Tech chips -->
  <g class="mono" font-size="13" fill="#e9d5ff">
    <rect x="52" y="204" width="44" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="74" y="223" text-anchor="middle">C#</text>

    <rect x="104" y="204" width="118" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="163" y="223" text-anchor="middle">ASP.NET Core</text>

    <rect x="230" y="204" width="82" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="271" y="223" text-anchor="middle">EF Core</text>

    <rect x="320" y="204" width="102" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="371" y="223" text-anchor="middle">SQL Server</text>
  </g>

  <!-- Code editor card -->
  <g>
    <rect x="590" y="40" width="370" height="200" rx="14" fill="#0d0a1f" fill-opacity="0.92" stroke="#5b43a8" stroke-width="1.5"/>
    <path d="M590 54 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v28 h-370 z" fill="#1a1236"/>
    <line x1="590" y1="82" x2="960" y2="82" stroke="#5b43a8" stroke-width="1.5"/>

    <circle cx="612" cy="61" r="5" fill="#f472b6"/>
    <circle cx="630" cy="61" r="5" fill="#a78bfa"/>
    <circle cx="648" cy="61" r="5" fill="#67e8f9"/>

    <text x="948" y="65" text-anchor="end" class="mono" font-size="12" fill="#a99ad6">HelloController.cs</text>

    <g class="mono" font-size="14" fill="#5f5290" text-anchor="end">
      <text x="624" y="115">1</text>
      <text x="624" y="143">2</text>
      <text x="624" y="171">3</text>
      <text x="624" y="199">4</text>
    </g>

    <g class="mono" font-size="14" fill="#e5e7eb">
      <text x="640" y="115"><tspan fill="#f0abfc">[HttpGet(</tspan><tspan fill="#fcd34d">"api/hello"</tspan><tspan fill="#f0abfc">)]</tspan></text>
      <text x="640" y="143"><tspan fill="#c4b5fd">public</tspan> <tspan fill="#67e8f9">IActionResult</tspan> Hello()</text>
      <text x="656" y="171"><tspan fill="#c4b5fd">=&gt;</tspan> Ok(<tspan fill="#c4b5fd">new</tspan> { status = <tspan fill="#fcd34d">"ok"</tspan> });</text>
      <text x="640" y="199" fill="#6d609e">// 200 OK</text>
      <rect x="718" y="187" width="8" height="15" fill="#f472b6" class="cursor"/>
    </g>
  </g>
</svg>
